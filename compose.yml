services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    container_name: keycloak
    command: start-dev

    environment:
      - KEYCLOAK_ADMIN=${KEYCLOAK_ADMIN}
      - KEYCLOAK_ADMIN_PASSWORD=${KEYCLOAK_ADMIN_PASSWORD}
      # Hace que el issuer de los tokens sea accesible desde el navegador.
      - KC_HOSTNAME=http://localhost:8080
    volumes:
      - keycloak_data:/opt/keycloak/data
    ports:
      - "127.0.0.1:8080:8080"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: backend_keycloak

    environment:
      - KEYCLOAK_PUBLIC_URL=http://localhost:8080
      - KEYCLOAK_INTERNAL_URL=http://keycloak:8080
      - KEYCLOAK_REALM=${KEYCLOAK_REALM:-myrealm}
      - KEYCLOAK_CLIENT_ID=${KEYCLOAK_CLIENT_ID:-dummy-backend}
      - KEYCLOAK_CLIENT_SECRET=${KEYCLOAK_CLIENT_SECRET:-}
      - APP_URL=http://localhost:8000
      - SESSION_SECRET=${SESSION_SECRET:-local-development-secret-change-me}

    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      - keycloak

volumes:
  keycloak_data:
